name: TongShang
options:
  bundleIdPrefix: com.tongshang
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 2
targets:
  TongShang:
    type: application
    platform: iOS
    sources:
      - path: TongShang
        excludes:
          - Resources
      - path: TongShang/Resources/products.json
        buildPhase: resources
      - path: TongShang/Resources/zh-Hans.lproj
        buildPhase: resources
      - path: TongShang/Resources/Viewer
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Viewer
      - path: TongShang/Resources/Models
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Models
    info:
      path: TongShang/Info.plist
      properties:
        CFBundleDisplayName: TongShang
        CFBundleName: TongShang
        UILaunchScreen: {}
        NSCameraUsageDescription: 相机仅用于扫描童装吊牌上的商品编码；画面不会被保存或上传。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edmelody.tongshang.viewer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  TongShangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TongShangTests
    dependencies:
      - target: TongShang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tongshang.viewer.tests
schemes:
  TongShang:
    build:
      targets:
        TongShang: all
        TongShangTests: [test]
    test:
      targets:
        - TongShangTests
