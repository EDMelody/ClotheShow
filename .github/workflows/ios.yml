name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test on Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate bundled assets
        run: |
          npm ci
          npm run build:assets
          npm run test:web

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project TongShang.xcodeproj \
            -scheme TongShang \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild.log

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project TongShang.xcodeproj \
            -scheme TongShang \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee -a xcodebuild.log

      - name: Package unsigned IPA for AltStore
        run: |
          rm -rf Payload TongShang-unsigned.ipa TongShang-unsigned.ipa.sha256
          mkdir Payload
          ditto DerivedData/Build/Products/Release-iphoneos/TongShang.app Payload/TongShang.app
          ditto -c -k --sequesterRsrc --keepParent Payload TongShang-unsigned.ipa
          unzip -Z1 TongShang-unsigned.ipa > ipa-entries.txt
          grep -Fx 'Payload/TongShang.app/products.json' ipa-entries.txt
          grep -Fx 'Payload/TongShang.app/zh-Hans.lproj/InfoPlist.strings' ipa-entries.txt
          grep -Fx 'Payload/TongShang.app/Viewer/index.html' ipa-entries.txt
          grep -Fx 'Payload/TongShang.app/Viewer/viewer.bundle.js' ipa-entries.txt
          test "$(grep -Ec '^Payload/TongShang.app/Models/.+\.glb$' ipa-entries.txt)" -eq 6
          test "$(grep -Ec '^Payload/TongShang.app/Models/.+\.usdz$' ipa-entries.txt)" -eq 6
          shasum -a 256 TongShang-unsigned.ipa > TongShang-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TongShang-unsigned-ipa
          path: |
            TongShang-unsigned.ipa
            TongShang-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
